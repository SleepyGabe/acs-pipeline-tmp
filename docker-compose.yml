# Local test environment for the Oracle -> Postgres migration notebook.
#
#   docker compose up -d          # start both databases + the Jupyter server
#   docker compose logs -f oracle # watch Oracle finish first-time setup (can take a few minutes)
#   docker compose down           # stop containers (keep data)
#   docker compose down -v        # stop and wipe data volumes
#
# Once the stack is healthy, open the notebook at:  http://localhost:8888/lab?token=ora2pg
# (the repo is mounted at /home/jovyan/work, so open oracle_to_postgres_migration.ipynb there).
#
# Connection values below are intentionally aligned with the notebook's cell §1
# defaults — see docker/README.md for the exact values to paste in.

services:
  oracle:
    # XE 21c slim. Apple Silicon / arm64 users: see docker/README.md (use oracle-free or add platform).
    image: gvenzl/oracle-xe:21-slim
    container_name: ora2pg-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_admin_pw        # SYS / SYSTEM password
      APP_USER: oracle_user                   # application user == notebook ORACLE_USER
      APP_USER_PASSWORD: oracle_password      # == notebook ORACLE_PASSWORD
    volumes:
      # *.sql here run once, alphabetically, on first DB creation.
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  postgres:
    image: postgres:16
    container_name: ora2pg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres_user            # == notebook PG_USER
      POSTGRES_PASSWORD: postgres_password    # == notebook PG_PASSWORD
      POSTGRES_DB: target_db                  # == notebook PG_DATABASE
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d target_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Jupyter server with the migration notebook pre-wired to the DB containers.
  # The notebook's cell §1 reads each connection value from an env var (falling
  # back to its placeholder), so the variables below make it "just run" against
  # the oracle/postgres services on this compose network — no cell editing.
  jupyter:
    image: quay.io/jupyter/base-notebook:latest
    container_name: ora2pg-jupyter
    ports:
      - "8888:8888"
    environment:
      # Fixed token so the URL is stable: http://localhost:8888/lab?token=ora2pg
      JUPYTER_TOKEN: ora2pg
      # ---- Oracle (SOURCE): reach the container by its compose service name ----
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE_NAME: XEPDB1            # gvenzl/oracle-xe default PDB (oracle-free: FREEPDB1)
      ORACLE_SID: ""                         # empty -> notebook uses service name
      ORACLE_USER: oracle_user
      ORACLE_PASSWORD: oracle_password
      ORACLE_SCHEMA: ORACLE_USER
      # ---- Postgres (TARGET) ----
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: target_db
      PG_USER: postgres_user
      PG_PASSWORD: postgres_password
      PG_SCHEMA: public
      PG_SSLMODE: disable
      # Dump dir on the mounted repo (gitignored ora2pg/) so files survive restarts.
      WORK_DIR: /home/jovyan/work/ora2pg
    volumes:
      - ./:/home/jovyan/work
    working_dir: /home/jovyan/work
    # Install the two drivers the notebook needs, then start JupyterLab. (The
    # notebook's "%pip install" / "%restart_python" cell is Databricks-only and
    # can be skipped here, since the drivers are already present.)
    command: >
      bash -c "pip install --quiet --no-cache-dir oracledb psycopg2-binary &&
               start-notebook.py --IdentityProvider.token=\"$${JUPYTER_TOKEN}\""
    depends_on:
      oracle:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  oracle-data:
  postgres-data:
